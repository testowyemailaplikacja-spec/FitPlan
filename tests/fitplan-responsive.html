<!doctype html>
<html lang="pl">

<title>FitPlan — kontrola szerokości ekranu</title>
<style>
body{margin:0;padding:16px;background:#eef1f5;color:#152033;font:16px system-ui}

iframe{display:block;border:1px solid #8794a8;max-width:100%;background:#fff}

</select></label>
